<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CCLE Rubber | Careers Portal</title>
<meta name="description" content="CCLE Rubber careers and recruitment portal">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{--g:#0B3D2E;--g2:#145642;--gold:#C9A227;--ink:#111;--muted:#68746f;--line:#e2e9e4;--bg:#f5f8f6;--white:#fff;--red:#a92e2e}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:"DM Sans",sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.top{background:var(--g);color:white;padding:9px 5%;font-size:12px;display:flex;justify-content:space-between}.nav{position:sticky;top:0;z-index:5;background:white;box-shadow:0 3px 15px #0000000b;padding:14px 5%;display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}.brand{font:800 18px Manrope;display:flex;align-items:center;gap:10px;color:var(--g)}.logo{background:var(--gold);padding:9px;border-radius:8px}.navlinks{display:flex;gap:5px;align-items:center;flex-wrap:wrap}.navlinks button,.plain{border:0;background:transparent;padding:10px 12px;border-radius:8px;font-weight:700;color:#293a31}.navlinks button:hover,.navlinks button.active{background:#eaf2ed;color:var(--g)}.btn{border:0;background:var(--gold);color:#151515;padding:11px 16px;border-radius:8px;font-weight:800}.btn.green{background:var(--g);color:white}.btn.light{background:white;border:1px solid var(--line)}.btn.red{background:var(--red);color:white}.btn.small{padding:7px 10px;font-size:12px}.hidden{display:none!important}.hero{background:linear-gradient(110deg,#082c22ed,#0b3d2ee8);color:white;padding:72px 7%;position:relative;overflow:hidden}.hero:after{content:"";position:absolute;width:390px;height:390px;border:1px solid #ffffff20;border-radius:50%;right:-100px;top:-140px;box-shadow:0 0 0 45px #ffffff08,0 0 0 95px #ffffff05}.eyebrow{font-size:12px;letter-spacing:2px;text-transform:uppercase;color:var(--gold);font-weight:800}.hero h1{font:800 clamp(34px,5vw,58px)/1.1 Manrope;max-width:720px;margin:16px 0}.hero p{max-width:620px;line-height:1.7;color:#e2eee8;font-size:17px}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:25px}.wrap{max-width:1180px;margin:auto;padding:34px 22px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:13px;margin-top:-26px;position:relative}.stat,.card,.panel{background:white;border:1px solid var(--line);border-radius:13px;padding:20px;box-shadow:0 10px 28px #0b3d2e0c}.stat strong{display:block;font:800 29px Manrope;color:var(--g)}.stat span,.muted{color:var(--muted);font-size:13px}.heading{display:flex;justify-content:space-between;align-items:end;gap:15px;margin:38px 0 17px}.heading h2,.page-title h1{font:800 27px Manrope;color:var(--g);margin:0}.heading p,.page-title p{color:var(--muted);margin:6px 0 0}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.dept{background:white;border:1px solid var(--line);padding:17px;border-radius:11px;font-weight:700}.dept small{display:block;color:var(--muted);font-weight:400;margin-top:6px}.job{background:white;border:1px solid var(--line);border-radius:12px;padding:19px;display:flex;flex-direction:column;gap:9px}.job h3{margin:0;color:var(--g)}.meta{display:flex;gap:12px;flex-wrap:wrap;color:var(--muted);font-size:12px}.tag{background:#edf4ef;color:var(--g);padding:5px 9px;border-radius:30px;font-size:11px;font-weight:800;display:inline-block}.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:13px}.step{background:white;border:1px solid var(--line);border-radius:11px;padding:18px}.step b{display:grid;place-items:center;background:var(--g);color:white;width:32px;height:32px;border-radius:50%;margin-bottom:10px}.page-title{margin-bottom:22px}.page-title h1{font-size:32px}.filters{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:17px}.filters input,.filters select,.field input,.field select,.field textarea{width:100%;padding:11px 12px;border:1px solid #d6e0d9;border-radius:8px;background:white;outline:none}.filters input{flex:2;min-width:190px}.filters select{flex:1;min-width:160px}.field{display:flex;flex-direction:column;gap:6px;margin-bottom:13px;min-width:0}.field label{font-size:12px;font-weight:800;color:#34463c}.field textarea{min-height:90px;resize:vertical}.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 13px}.wide{grid-column:1/-1}.auth{max-width:530px;margin:auto}.tabs{display:flex;gap:8px;margin-bottom:17px}.tabs button,.toggle button{border:1px solid var(--line);background:white;padding:10px 14px;border-radius:8px;font-weight:700}.tabs button.active,.toggle button.active{background:var(--g);color:white}.dashboard{display:grid;grid-template-columns:220px minmax(0,1fr);gap:17px}.side{background:var(--g);border-radius:12px;padding:13px;height:max-content}.side button{display:block;width:100%;text-align:left;background:transparent;border:0;color:#e3eee7;padding:11px;border-radius:7px}.side button.active,.side button:hover{background:#ffffff20}.metricgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:11px;margin-bottom:16px}.metric{background:white;border:1px solid var(--line);border-radius:10px;padding:15px}.metric strong{display:block;color:var(--g);font:800 24px Manrope}.metric small{color:var(--muted)}.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:10px;background:white}table{border-collapse:collapse;width:100%;min-width:620px}th,td{text-align:left;padding:11px 13px;border-bottom:1px solid var(--line);font-size:13px}th{background:#f0f5f1;color:var(--g)}td .btn{margin:2px}.notice{background:#fff8df;border:1px solid #efdfa2;color:#695516;padding:12px;border-radius:8px;font-size:13px;margin:12px 0}.notice.success{background:#e8f6ec;border-color:#b8ddc2;color:#1e6635}.notice.error{background:#fff0f0;border-color:#efc3c3;color:#982b2b}.toast{position:fixed;right:18px;bottom:18px;background:#173e2e;color:white;padding:13px 17px;border-radius:9px;z-index:20;max-width:90vw;box-shadow:0 8px 25px #0002}.toast.error{background:#982b2b}.footer{background:#082e23;color:#dce9e1;padding:32px 6%;margin-top:45px}.footer b{color:var(--gold)}.empty{text-align:center;padding:30px;color:var(--muted)}.progress{height:7px;background:#e8eee9;border-radius:8px;margin:12px 0 20px;overflow:hidden}.progress span{display:block;height:100%;background:var(--gold)}.toggle{display:flex;gap:8px;margin-bottom:15px}.inline{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.right{margin-left:auto}
@media(max-width:800px){.grid{grid-template-columns:repeat(2,1fr)}.stats,.metricgrid{grid-template-columns:repeat(2,1fr)}.steps{grid-template-columns:repeat(2,1fr)}.dashboard{grid-template-columns:1fr}.side{display:flex;overflow:auto;gap:4px}.side button{white-space:nowrap;width:auto}.nav{align-items:flex-start;flex-direction:column}.hero{padding:52px 7%}}
@media(max-width:520px){.grid,.formgrid{grid-template-columns:1fr}.wide{grid-column:auto}.wrap{padding:25px 14px}.steps{grid-template-columns:1fr 1fr}.heading{align-items:flex-start;flex-direction:column}.top{font-size:10px}}
</style>
</head>
<body>
<div class="top"><span>CCLE RUBBER • CAREERS & OPPORTUNITIES</span><span>Building careers. Strengthening industry.</span></div>
<header class="nav">
 <div class="brand"><span class="logo">CC</span><span>CCLE RUBBER <small style="display:block;font:600 10px 'DM Sans';letter-spacing:2px;color:#68746f">CAREERS PORTAL</small></span></div>
 <nav class="navlinks">
  <button data-page="home" class="active">Home</button><button data-page="vacancies">Vacancies</button><button data-page="benefits">Benefits</button>
  <button data-page="login" id="loginNav">Login / Register</button><button data-page="dashboard" id="dashNav" class="hidden">Dashboard</button><button id="logoutBtn" class="hidden">Logout</button>
 </nav>
</header>
<main id="app"></main>
<footer class="footer"><b>CCLE RUBBER</b><p>Career opportunities and recruitment portal.</p><small>© <span id="year"></span> CCLE Rubber. All rights reserved.</small></footer>
<div id="toast" class="toast hidden" role="status"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(()=>{'use strict';
const SUPABASE_URL='https://mlsndpiamixtyvsdgccr.supabase.co';
const SUPABASE_PUBLISHABLE_KEY='sb_publishable_BtGWinW1ZhoFd4sv0NAOVA_eWY3FTmA';
const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);
const DEPTS=['Packaging Department','Mixing Department','Tyres Vulcanization Department','Tyre Extrusion Department','Reclaimed Rubber Department','Tyre and Tube Quality Control Department','Warehouse and Finished Goods Department','Tube Vulcanization Department','Tube Joint Department','Security Personnel','Management Department'];
const STATUSES=['Submitted','Under Review','Shortlisted','Interview Scheduled','Offered','Hired','Rejected'];
const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>n==null||n===''?'Not specified':new Intl.NumberFormat('en-NG',{style:'currency',currency:'NGN',maximumFractionDigits:0}).format(Number(n));
let currentUser=null,profile=null,userRole='Applicant',currentPage='home',dashTab='overview',allJobs=[],myApps=[],myInterviews=[],step=0,draft={},selectedCV=null;
const notify=(msg,type='')=>{const el=$('#toast');el.textContent=msg;el.className='toast '+type;setTimeout(()=>el.classList.add('hidden'),4200)};
const run=async query=>{const {data,error}=await query;if(error)throw error;return data};
const guarded=fn=>async(...args)=>{try{return await fn(...args)}catch(e){console.error(e);notify(e.message||'Request failed. Check table columns and Row Level Security policies.','error')}};
function nav(p){currentPage=p;document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===p));render()}
document.querySelectorAll('[data-page]').forEach(b=>b.addEventListener('click',()=>nav(b.dataset.page)));
$('#year').textContent=new Date().getFullYear();
$('#logoutBtn').onclick=async()=>{await db.auth.signOut();currentUser=null;profile=null;setNav();nav('home');notify('Signed out successfully.')};
$('#dashNav').onclick=()=>nav('dashboard');
function setNav(){$('#loginNav').classList.toggle('hidden',!!currentUser);$('#dashNav').classList.toggle('hidden',!currentUser);$('#logoutBtn').classList.toggle('hidden',!currentUser)}
async function loadProfile(){if(!currentUser)return;try{profile=await run(db.from('users').select('*').eq('id',currentUser.id).maybeSingle());userRole=profile?.role||'Applicant'}catch(e){profile=null;userRole='Applicant'}}
async function loadJobs(){try{allJobs=await run(db.from('jobs').select('*').order('created_at',{ascending:false}))||[]}catch(e){allJobs=[];console.warn('jobs query:',e.message)}}
const pageTitle=(title,sub='')=>`<div class="page-title"><h1>${title}</h1><p>${sub}</p></div>`;
const deptOptions=selected=>DEPTS.map(d=>`<option ${selected===d?'selected':''}>${esc(d)}</option>`).join('');
function home(){let open=allJobs.filter(j=>['open','approved','published'].includes(String(j.status||'open').toLowerCase()));return `<section class="hero"><div class="eyebrow">Build your future with us</div><h1>Find your place.<br>Build something that lasts.</h1><p>Explore career opportunities at CCLE Rubber and become part of a team shaping quality rubber products and industrial growth.</p><div class="actions"><button class="btn" onclick="window.go('vacancies')">Explore vacancies</button><button class="btn" style="background:white" onclick="window.go('login')">Create an account</button></div></section><div class="wrap"><div class="stats"><div class="stat"><strong>${allJobs.length}</strong><span>Listed opportunities</span></div><div class="stat"><strong>${DEPTS.length}</strong><span>Departments</span></div><div class="stat"><strong>1</strong><span>Career destination</span></div><div class="stat"><strong>∞</strong><span>Room to grow</span></div></div><div class="heading"><div><h2>Our departments</h2><p>Explore the teams that make our operations possible.</p></div></div><div class="grid">${DEPTS.map((d,i)=>`<div class="dept">${esc(d)}<small>Explore opportunities in this department</small></div>`).join('')}</div><div class="heading"><div><h2>Featured vacancies</h2><p>Current opportunities published in the portal.</p></div><button class="btn green" onclick="window.go('vacancies')">All vacancies</button></div><div class="grid">${open.length?open.slice(0,3).map(jobCard).join(''):'<div class="card empty">No vacancies have been published yet.</div>'}</div><div class="heading"><div><h2>How it works</h2><p>Your next career step in four simple stages.</p></div></div><div class="steps"><div class="step"><b>1</b><strong>Create your account</strong><p class="muted">Register securely with your email.</p></div><div class="step"><b>2</b><strong>Find a vacancy</strong><p class="muted">Search by department and job type.</p></div><div class="step"><b>3</b><strong>Apply online</strong><p class="muted">Complete your profile and submit your application.</p></div><div class="step"><b>4</b><strong>Track progress</strong><p class="muted">Follow your application and interview updates.</p></div></div></div>`}
function jobCard(j){return `<article class="job"><div class="inline"><span class="tag">${esc(j.job_type||'Full-time')}</span><span class="tag">${esc(j.status||'Open')}</span></div><h3>${esc(j.title||'Untitled vacancy')}</h3><div class="meta"><span>${esc(j.department||'Department not set')}</span><span>${esc(j.location||'Location not set')}</span></div><div class="meta"><span>${money(j.salary_min)} – ${money(j.salary_max)}</span><span>${j.deadline?'Deadline: '+esc(j.deadline):''}</span></div><div class="inline"><button class="btn light small" onclick="window.jobDetails('${esc(j.id)}')">View details</button><button class="btn small" onclick="window.applyJob('${esc(j.id)}')">Apply now</button></div></article>`}
function vacancies(){return `<div class="wrap">${pageTitle('Current vacancies','Search opportunities and apply directly through the portal.')}<div class="filters"><input id="jobSearch" placeholder="Search job title or keyword"><select id="deptFilter"><option value="">All departments</option>${deptOptions()}</select><select id="typeFilter"><option value="">All job types</option><option>Full-time</option><option>Contract</option><option>Shift</option></select></div><div class="grid" id="jobResults"></div></div>`}
function drawVacancies(){let q=($('#jobSearch')?.value||'').toLowerCase(),d=$('#deptFilter')?.value||'',t=$('#typeFilter')?.value||'';let list=allJobs.filter(j=>{let status=String(j.status||'open').toLowerCase();return ['open','approved','published'].includes(status)&&(!q||`${j.title} ${j.description} ${j.department}`.toLowerCase().includes(q))&&(!d||j.department===d)&&(!t||j.job_type===t)});$('#jobResults').innerHTML=list.length?list.map(jobCard).join(''):'<div class="card empty">No matching vacancies found.</div>'}
function benefits(){return `<div class="wrap">${pageTitle('Employee benefits','Benefit information configured by CCLE Rubber.')}<div class="toggle"><button class="active" id="newBenefits">New Staff (0–1 Year)</button><button id="oldBenefits">Old Staff (1+ Year)</button></div><div class="tablewrap"><table><thead><tr><th>Benefit</th><th>Details</th></tr></thead><tbody id="benefitRows"><tr><td colspan="2">Loading benefit information…</td></tr></tbody></table></div><p class="muted">Benefits displayed here are sourced from the benefits table. Contact HR for clarification on eligibility.</p></div>`}
async function drawBenefits(mode){benefitsMode=mode;$('#newBenefits').classList.toggle('active',mode==='new');$('#oldBenefits').classList.toggle('active',mode==='old');try{let rows=await run(db.from('benefits').select('*'));let filtered=(rows||[]).filter(r=>{let s=String(r.staff_type||r.category||r.eligibility||'').toLowerCase();return mode==='new'?s.includes('new')||s.includes('0-1')||s.includes('0–1'):s.includes('old')||s.includes('1+')||s.includes('experienced')});let names=['Salary','Health','Leave','Transport','Training','Pension','Meal','Housing'];let body=names.map(n=>{let row=filtered.find(r=>String(r.benefit_name||r.name||r.type||'').toLowerCase()===n.toLowerCase());return `<tr><td><b>${n}</b></td><td>${esc(row?.description||row?.amount||row?.value||'Contact HR for current details')}</td></tr>`}).join('');$('#benefitRows').innerHTML=body}catch(e){$('#benefitRows').innerHTML='<tr><td colspan="2">Benefits could not be loaded. Check benefits table permissions and columns.</td></tr>';notify(e.message,'error')}}
function login(){return `<div class="wrap"><div class="auth panel"><div class="tabs"><button class="active" id="loginTab">Login</button><button id="registerTab">Register</button></div><div id="authFields"><div class="field"><label>Email address</label><input id="authEmail" type="email" required autocomplete="email"></div><div class="field"><label>Password</label><input id="authPassword" type="password" required minlength="8" autocomplete="current-password"></div><div id="registerExtra" class="hidden"><div class="field"><label>Full name</label><input id="authName" autocomplete="name"></div><div class="field"><label>Phone number</label><input id="authPhone" type="tel"></div><div class="field"><label>Account role</label><select id="authRole"><option>Applicant</option><option>Employer/HR</option><option>Admin</option></select><small class="muted">For security, new registrations are created as Applicant. HR/Admin access must be granted by an administrator in the database.</small></div></div><button class="btn green" style="width:100%" id="authSubmit">Login</button><p class="muted" id="authHelp">Use your registered email and password.</p></div></div></div>`}
let authMode='login';
async function submitAuth(){let email=$('#authEmail').value.trim(),password=$('#authPassword').value;if(!email||!password){notify('Enter your email and password.','error');return}if(authMode==='register'){let name=$('#authName').value.trim(),phone=$('#authPhone').value.trim();if(!name){notify('Enter your full name.','error');return}let {data,error}=await db.auth.signUp({email,password,options:{data:{full_name:name,phone,role:'Applicant'}}});if(error)throw error;if(data.user){let payload={id:data.user.id,email,full_name:name,phone,role:'Applicant'};let {error:pe}=await db.from('users').upsert(payload,{onConflict:'id'});if(pe)console.warn('Profile creation:',pe.message)}notify('Registration submitted. Check your email if confirmation is enabled.');if(data.session){currentUser=data.user;await loadProfile();setNav();nav('dashboard')}}else{let {data,error}=await db.auth.signInWithPassword({email,password});if(error)throw error;currentUser=data.user;await loadProfile();setNav();notify('Welcome back.');nav('dashboard')}}
function loginBind(){$('#loginTab').onclick=()=>{authMode='login';$('#loginTab').classList.add('active');$('#registerTab').classList.remove('active');$('#registerExtra').classList.add('hidden');$('#authSubmit').textContent='Login';$('#authHelp').textContent='Use your registered email and password.'};$('#registerTab').onclick=()=>{authMode='register';$('#registerTab').classList.add('active');$('#loginTab').classList.remove('active');$('#registerExtra').classList.remove('hidden');$('#authSubmit').textContent='Create account';$('#authHelp').textContent='A confirmation email may be required.'};$('#authSubmit').onclick=guarded(submitAuth)}
function dashboard(){if(!currentUser)return `<div class="wrap">${pageTitle('Sign in required','Log in to access your dashboard.')}<button class="btn green" onclick="window.go('login')">Login / Register</button></div>`;let tabs=userRole==='Admin'?['overview','users','jobs','applications','audit','settings']:['overview','profile','applications','apply','interviews','letters'];if(['Employer/HR','HR','Employer'].includes(userRole))tabs=['overview','jobs','applicants','interviews','letters'];return `<div class="wrap">${pageTitle(`${esc(userRole)} dashboard`,`Signed in as ${esc(currentUser.email||'')}`)}<div class="dashboard"><aside class="side">${tabs.map(t=>`<button data-tab="${t}" class="${dashTab===t?'active':''}">${({overview:'Overview',profile:'My profile',applications:'Applications',apply:'New application',interviews:'Interviews',letters:'Employment letters',jobs:'Manage vacancies',applicants:'Applicants',users:'Manage users',audit:'Audit log',settings:'Site settings'})[t]||t}</button>`).join('')}</aside><section class="dashmain" id="dashContent"><div class="empty">Loading dashboard…</div></section></div></div>`}
function dashBind(){document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{dashTab=b.dataset.tab;render();loadDashTab()});loadDashTab()}
async function loadDashTab(){let el=$('#dashContent');if(!el)return;try{if(dashTab==='overview')return await overview(el);if(dashTab==='profile')return profileView(el);if(dashTab==='apply')return applicationForm(el);if(dashTab==='applications'||dashTab==='applicants')return applicationsView(el);if(dashTab==='interviews')return interviewsView(el);if(dashTab==='letters')return lettersView(el);if(dashTab==='jobs')return jobsManage(el);if(dashTab==='users')return usersManage(el);if(dashTab==='audit')return auditView(el);if(dashTab==='settings')return settingsView(el)}catch(e){el.innerHTML=`<div class="notice error">${esc(e.message)}</div>`}}
async function overview(el){let counts={jobs:allJobs.length,applications:0,hired:0,users:0};try{let a=await run(db.from('applications').select('id,status'));counts.applications=a.length;counts.hired=a.filter(x=>x.status==='Hired').length}catch(e){}if(userRole==='Admin'){try{let u=await run(db.from('users').select('id'));counts.users=u.length}catch(e){}}el.innerHTML=`<div class="metricgrid"><div class="metric"><strong>${counts.jobs}</strong><small>Total vacancies</small></div><div class="metric"><strong>${counts.applications}</strong><small>Applications</small></div><div class="metric"><strong>${counts.hired}</strong><small>Hired</small></div><div class="metric"><strong>${userRole==='Admin'?counts.users:'—'}</strong><small>Total users</small></div></div><div class="panel"><h3>Welcome, ${esc(profile?.full_name||currentUser.email)}</h3><p class="muted">Use the dashboard menu to manage your career activity and account.</p></div>`}
function profileView(el){el.innerHTML=`<div class="panel"><h3>My profile</h3><form id="profileForm"><div class="formgrid"><div class="field"><label>Full name</label><input name="full_name" required value="${esc(profile?.full_name||'')}"></div><div class="field"><label>Phone</label><input name="phone" value="${esc(profile?.phone||'')}"></div><div class="field"><label>Email</label><input value="${esc(currentUser.email)}" disabled></div><div class="field"><label>Role</label><input value="${esc(userRole)}" disabled></div></div><button class="btn green">Save profile</button></form></div>`;$('#profileForm').onsubmit=guarded(async e=>{e.preventDefault();let f=Object.fromEntries(new FormData(e.target));let data=await run(db.from('users').upsert({id:currentUser.id,email:currentUser.email,...f},{onConflict:'id'}).select().single());profile=data;notify('Profile saved.')})}
function applicationForm(el){let labels=['Personal','Education','Experience','Department & guarantor','CV upload','Review'];el.innerHTML=`<div class="panel"><h3>Employment application</h3><div class="muted">Step ${step+1} of 6 — ${labels[step]}</div><div class="progress"><span style="width:${(step+1)/6*100}%"></span></div><form id="applyForm"><div id="stepFields"></div><div class="inline"><button type="button" class="btn light" id="prevStep" ${step===0?'disabled':''}>Back</button><button class="btn green" id="nextStep">${step===5?'Submit application':'Continue'}</button></div></form></div>`;drawStep();$('#prevStep').onclick=()=>{if(step>0){step--;applicationForm(el)}};$('#applyForm').onsubmit=guarded(async e=>{e.preventDefault();let fields=Object.fromEntries(new FormData(e.target));draft={...draft,...fields};if(step<5){step++;applicationForm(el);return}await submitApplication();step=0;draft={};dashTab='applications';render();loadDashTab()})}
function drawStep(){let target=$('#stepFields');let jobOpts=allJobs.filter(j=>['open','approved','published'].includes(String(j.status||'open').toLowerCase())).map(j=>`<option value="${esc(j.id)}">${esc(j.title)} — ${esc(j.department||'')}</option>`).join('');let fields=[
`<div class="formgrid"><div class="field"><label>Full name *</label><input name="full_name" required value="${esc(draft.full_name||profile?.full_name||'')}"></div><div class="field"><label>Date of birth *</label><input name="date_of_birth" type="date" required value="${esc(draft.date_of_birth||'')}"></div><div class="field"><label>Phone *</label><input name="phone" required value="${esc(draft.phone||profile?.phone||'')}"></div><div class="field"><label>Gender</label><select name="gender"><option value="">Select</option><option>Female</option><option>Male</option><option>Prefer not to say</option></select></div><div class="field wide"><label>Residential address *</label><input name="address" required value="${esc(draft.address||'')}"></div></div>`,
`<div class="formgrid"><div class="field"><label>Highest qualification *</label><input name="qualification" required value="${esc(draft.qualification||'')}"></div><div class="field"><label>Institution *</label><input name="institution" required value="${esc(draft.institution||'')}"></div><div class="field"><label>Course of study</label><input name="course" value="${esc(draft.course||'')}"></div><div class="field"><label>Graduation year</label><input name="graduation_year" type="number" min="1950" max="2100" value="${esc(draft.graduation_year||'')}"></div></div>`,
`<div class="formgrid"><div class="field"><label>Years of experience</label><input name="experience_years" type="number" min="0" value="${esc(draft.experience_years||'0')}"></div><div class="field"><label>Previous employer</label><input name="previous_employer" value="${esc(draft.previous_employer||'')}"></div><div class="field wide"><label>Work experience summary</label><textarea name="experience_summary">${esc(draft.experience_summary||'')}</textarea></div></div>`,
`<div class="formgrid"><div class="field"><label>Department *</label><select name="department" required>${deptOptions(draft.department)}</select></div><div class="field"><label>Vacancy *</label><select name="job_id" required><option value="">Select vacancy</option>${jobOpts}</select></div><div class="field"><label>Guarantor full name *</label><input name="guarantor_name" required value="${esc(draft.guarantor_name||'')}"></div><div class="field"><label>Guarantor phone *</label><input name="guarantor_phone" required value="${esc(draft.guarantor_phone||'')}"></div><div class="field wide"><label>Guarantor address</label><input name="guarantor_address" value="${esc(draft.guarantor_address||'')}"></div></div>`,
`<div class="field"><label>Upload CV (PDF, DOC, DOCX) *</label><input type="file" id="cvFile" accept=".pdf,.doc,.docx" required><small class="muted">The CV is uploaded to the Supabase Storage bucket named <b>cvs</b>.</small></div>`,
`<div class="notice">Review your details before submission. Your application will be saved with status <b>Submitted</b>.</div><pre style="white-space:pre-wrap;font:13px 'DM Sans';background:#f4f7f5;padding:12px;border-radius:8px">${esc(JSON.stringify(draft,null,2))}</pre>`
];target.innerHTML=fields[step];if(step===4){$('#cvFile').onchange=()=>{selectedCV=$('#cvFile').files?.[0]||null}}if(draft.gender&&step===0)$('[name=gender]').value=draft.gender;if(draft.job_id&&step===3)$('[name=job_id]').value=draft.job_id}
async function submitApplication(){let cv=selectedCV||$('#cvFile')?.files?.[0];if(!cv){throw Error('Please select your CV file.')}let safeName=cv.name.replace(/[^a-zA-Z0-9._-]/g,'_'),path=`${currentUser.id}/${Date.now()}_${safeName}`;let up=await db.storage.from('cvs').upload(path,cv,{upsert:false});if(up.error)throw up.error;let record={user_id:currentUser.id,full_name:draft.full_name,email:currentUser.email,phone:draft.phone,department:draft.department,job_id:draft.job_id,status:'Submitted',personal_details:{date_of_birth:draft.date_of_birth,gender:draft.gender,address:draft.address},education:{qualification:draft.qualification,institution:draft.institution,course:draft.course,graduation_year:draft.graduation_year},experience:{years:draft.experience_years,previous_employer:draft.previous_employer,summary:draft.experience_summary},guarantor:{name:draft.guarantor_name,phone:draft.guarantor_phone,address:draft.guarantor_address},cv_path:path};let {error}=await db.from('applications').insert(record);if(error)throw error;await audit('application_submitted',{job_id:draft.job_id});selectedCV=null;notify('Application submitted successfully.')}
async function applicationsView(el){let query=db.from('applications').select('*').order('created_at',{ascending:false});if(!['Admin','Employer/HR','HR','Employer'].includes(userRole))query=query.eq('user_id',currentUser.id);let rows=await run(query);myApps=rows;el.innerHTML=`<div class="panel"><div class="inline"><h3>${['Admin','Employer/HR','HR','Employer'].includes(userRole)?'All applications':'My applications'}</h3>${userRole==='Applicant'?'<button class="btn right" onclick="window.newApplication()">Apply for a job</button>':''}</div>${rows.length?`<div class="tablewrap"><table><thead><tr><th>Applicant</th><th>Department</th><th>Job</th><th>Status</th><th>Date</th>${userRole!=='Applicant'?'<th>Actions</th>':''}</tr></thead><tbody>${rows.map(a=>`<tr><td>${esc(a.full_name||a.email||a.user_id)}</td><td>${esc(a.department||'—')}</td><td>${esc(allJobs.find(j=>j.id===a.job_id)?.title||a.job_id||'—')}</td><td><span class="tag">${esc(a.status||'Submitted')}</span></td><td>${a.created_at?new Date(a.created_at).toLocaleDateString():'—'}</td>${userRole!=='Applicant'?`<td><select onchange="window.setStatus('${esc(a.id)}',this.value)">${STATUSES.map(s=>`<option ${a.status===s?'selected':''}>${s}</option>`).join('')}</select><button class="btn small light" onclick="window.scheduleInterview('${esc(a.id)}')">Interview</button><button class="btn small light" onclick="window.makeLetter('${esc(a.id)}')">Offer letter</button></td>`:''}</tr>`).join('')}</tbody></table></div>`:'<div class="empty">No applications found.</div>'}</div>`}
async function interviewsView(el){let rows=await run(db.from('interviews').select('*').order('interview_date',{ascending:true}));if(!['Admin','Employer/HR','HR','Employer'].includes(userRole))rows=rows.filter(x=>x.user_id===currentUser.id||myApps.some(a=>a.id===x.application_id));myInterviews=rows;el.innerHTML=`<div class="panel"><h3>My interviews</h3>${rows.length?`<div class="tablewrap"><table><thead><tr><th>Date</th><th>Time</th><th>Interviewer</th><th>Platform</th><th>Meeting</th></tr></thead><tbody>${rows.map(i=>`<tr><td>${esc(i.interview_date||'—')}</td><td>${esc(i.interview_time||'—')}</td><td>${esc(i.interviewer||'—')}</td><td>${esc(i.platform||'—')}</td><td>${i.meeting_link?`<a class="btn small" target="_blank" rel="noopener" href="${esc(i.meeting_link)}">Join</a>`:'Not set'}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">No interviews scheduled.</div>'}</div>`}
async function lettersView(el){let q=db.from('employmentLetters').select('*').order('created_at',{ascending:false});if(!['Admin','Employer/HR','HR','Employer'].includes(userRole))q=q.eq('user_id',currentUser.id);let rows=await run(q);el.innerHTML=`<div class="panel"><h3>Employment letters</h3>${rows.length?rows.map(l=>`<div class="inline" style="padding:12px 0;border-bottom:1px solid var(--line)"><div><b>${esc(l.employee_name||l.full_name||'Employment letter')}</b><div class="muted">${esc(l.department||'')} · ${esc(l.start_date||'')}</div></div><button class="btn small right" onclick="window.downloadLetter('${esc(l.id)}')">Download</button></div>`).join(''):'<div class="empty">No employment letters available.</div>'}</div>`}
function jobsManage(el){let rows=allJobs;el.innerHTML=`<div class="panel"><div class="inline"><h3>Manage vacancies</h3><button class="btn right" onclick="window.editJob()">Create vacancy</button></div>${rows.length?`<div class="tablewrap"><table><thead><tr><th>Title</th><th>Department</th><th>Type</th><th>Status</th><th>Actions</th></tr></thead><tbody>${rows.map(j=>`<tr><td>${esc(j.title)}</td><td>${esc(j.department)}</td><td>${esc(j.job_type)}</td><td>${esc(j.status||'Open')}</td><td><button class="btn small light" onclick="window.editJob('${esc(j.id)}')">Edit</button><button class="btn small light" onclick="window.closeJob('${esc(j.id)}')">Close</button><button class="btn small red" onclick="window.deleteJob('${esc(j.id)}')">Delete</button></td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">No vacancies yet.</div>'}</div><div id="jobEditor"></div>`}
function jobEditor(id){let j=allJobs.find(x=>x.id===id)||{};$('#jobEditor').innerHTML=`<div class="panel" style="margin-top:14px"><h3>${id?'Edit':'Create'} vacancy</h3><form id="jobForm"><div class="formgrid"><div class="field"><label>Job title *</label><input name="title" required value="${esc(j.title||'')}"></div><div class="field"><label>Department *</label><select name="department" required>${deptOptions(j.department)}</select></div><div class="field"><label>Location *</label><input name="location" required value="${esc(j.location||'')}"></div><div class="field"><label>Job type *</label><select name="job_type"><option ${j.job_type==='Full-time'?'selected':''}>Full-time</option><option ${j.job_type==='Contract'?'selected':''}>Contract</option><option ${j.job_type==='Shift'?'selected':''}>Shift</option></select></div><div class="field"><label>Minimum salary</label><input name="salary_min" type="number" min="0" value="${esc(j.salary_min||'')}"></div><div class="field"><label>Maximum salary</label><input name="salary_max" type="number" min="0" value="${esc(j.salary_max||'')}"></div><div class="field"><label>Vacancy count</label><input name="vacancy_count" type="number" min="1" value="${esc(j.vacancy_count||1)}"></div><div class="field"><label>Application deadline</label><input name="deadline" type="date" value="${esc(j.deadline||'')}"></div><div class="field wide"><label>Description *</label><textarea name="description" required>${esc(j.description||'')}</textarea></div><div class="field wide"><label>Requirements</label><textarea name="requirements">${esc(j.requirements||'')}</textarea></div><div class="field"><label>Qualifications</label><input name="qualifications" value="${esc(j.qualifications||'')}"></div><div class="field"><label>Experience</label><input name="experience" value="${esc(j.experience||'')}"></div></div><button class="btn green">Save vacancy</button></form></div>`;$('#jobForm').onsubmit=guarded(async e=>{e.preventDefault();let payload={...Object.fromEntries(new FormData(e.target)),salary_min:Number(e.target.salary_min.value)||null,salary_max:Number(e.target.salary_max.value)||null,vacancy_count:Number(e.target.vacancy_count.value)||1,status:j.status||'Open',created_by:currentUser.id};let q=id?db.from('jobs').update(payload).eq('id',id):db.from('jobs').insert(payload);await run(q);await audit(id?'job_updated':'job_created',{job_id:id||null});await loadJobs();notify('Vacancy saved.');dashTab='jobs';render();loadDashTab()})}
async function usersManage(el){let rows=await run(db.from('users').select('*').order('created_at',{ascending:false}));el.innerHTML=`<div class="panel"><h3>Manage users</h3><div class="tablewrap"><table><thead><tr><th>Name</th><th>Email</th><th>Role</th><th>Status</th><th>Actions</th></tr></thead><tbody>${rows.map(u=>`<tr><td>${esc(u.full_name||'')}</td><td>${esc(u.email||'')}</td><td>${esc(u.role||'Applicant')}</td><td>${esc(u.status||'Active')}</td><td><button class="btn small light" onclick="window.suspendUser('${esc(u.id)}','${u.status==='Suspended'?'Active':'Suspended'}')">${u.status==='Suspended'?'Restore':'Suspend'}</button><button class="btn small red" onclick="window.deleteUser('${esc(u.id)}')">Delete</button></td></tr>`).join('')}</tbody></table></div></div>`}
async function auditView(el){let rows=await run(db.from('auditLogs').select('*').order('created_at',{ascending:false}).limit(100));el.innerHTML=`<div class="panel"><h3>Audit log</h3><div class="tablewrap"><table><thead><tr><th>Event</th><th>User</th><th>Details</th><th>Date</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${esc(r.action||r.event||'')}</td><td>${esc(r.user_id||'')}</td><td>${esc(JSON.stringify(r.details||{}))}</td><td>${r.created_at?new Date(r.created_at).toLocaleString():''}</td></tr>`).join('')}</tbody></table></div></div>`}
function settingsView(el){el.innerHTML=`<div class="panel"><h3>Site settings</h3><p class="muted">Portal configuration values are managed through your Supabase project and database policies. This single-file client does not expose privileged service-role credentials.</p><div class="notice">For safety, never turn off Row Level Security on tables containing applicant records. Configure policies that allow applicants to access only their own records and HR/Admin users to perform authorized recruitment tasks.</div></div>`}
async function audit(action,details){try{await db.from('auditLogs').insert({user_id:currentUser.id,action,details})}catch(e){console.warn('Audit log:',e.message)}}
window.go=nav;window.newApplication=()=>{step=0;draft={};dashTab='apply';render();loadDashTab()};window.jobDetails=id=>{let j=allJobs.find(x=>x.id===id);if(!j)return;alert(`${j.title}\n${j.department||''}\n\n${j.description||'No description provided.'}\n\nRequirements: ${j.requirements||'Not specified'}`)};window.applyJob=id=>{if(!currentUser){notify('Please log in before applying.','error');nav('login');return}step=0;draft={job_id:id,department:allJobs.find(j=>j.id===id)?.department||''};dashTab='apply';nav('dashboard');loadDashTab()};
window.editJob=id=>jobEditor(id);window.closeJob=guarded(async id=>{await run(db.from('jobs').update({status:'Closed'}).eq('id',id));await loadJobs();notify('Vacancy closed.');render();loadDashTab()});window.deleteJob=guarded(async id=>{if(!confirm('Delete this vacancy?'))return;await run(db.from('jobs').delete().eq('id',id));await loadJobs();notify('Vacancy deleted.');render();loadDashTab()});
window.setStatus=guarded(async(id,status)=>{await run(db.from('applications').update({status}).eq('id',id));await audit('application_status_changed',{application_id:id,status});notify('Application status updated.')});
window.suspendUser=guarded(async(id,status)=>{await run(db.from('users').update({status}).eq('id',id));notify('User status updated.');loadDashTab()});window.deleteUser=guarded(async id=>{if(!confirm('Delete this user profile? This does not delete their Auth account.'))return;await run(db.from('users').delete().eq('id',id));notify('User profile deleted.');loadDashTab()});
window.scheduleInterview=guarded(async appId=>{let date=prompt('Interview date (YYYY-MM-DD):');if(!date)return;let time=prompt('Interview time (e.g. 10:00):');if(!time)return;let interviewer=prompt('Interviewer name:')||'';let platform=(prompt('Platform: JITSI, GOOGLE_MEET, or ZOOM','JITSI')||'JITSI').toUpperCase();let link=platform==='JITSI'?'https://meet.jit.si/CCLE-'+Math.random().toString(36).slice(2,10):platform==='ZOOM'?'':'https://meet.google.com/new';if(platform==='ZOOM')link=prompt('Paste your Zoom meeting URL:')||'';if(!/^https:\\/\\//.test(link))throw Error('A valid HTTPS meeting link is required.');await run(db.from('interviews').insert({application_id:appId,interview_date:date,interview_time:time,interviewer,platform,meeting_link:link,created_by:currentUser.id}));await run(db.from('applications').update({status:'Interview Scheduled'}).eq('id',appId));notify('Interview scheduled.')});
window.makeLetter=guarded(async appId=>{let a=myApps.find(x=>x.id===appId);if(!a){let rows=await run(db.from('applications').select('*').eq('id',appId).single());a=rows}let salary=prompt('Monthly salary (NGN):');if(salary===null)return;let start=prompt('Start date (YYYY-MM-DD):');if(!start)return;let job=allJobs.find(j=>j.id===a.job_id);await run(db.from('employmentLetters').insert({application_id:appId,user_id:a.user_id,employee_name:a.full_name,department:a.department,salary:Number(salary),start_date:start,created_by:currentUser.id}));notify('Employment letter record generated.');});
window.downloadLetter=guarded(async id=>{let l=await run(db.from('employmentLetters').select('*').eq('id',id).single());let content=`CCLE RUBBER\\nEMPLOYMENT LETTER\\n\\nDear ${l.employee_name||l.full_name||'Employee'},\\n\\nWe are pleased to offer you employment with CCLE Rubber in the ${l.department||'designated'} department.\\nSalary: ${money(l.salary)}\\nStart date: ${l.start_date||'To be confirmed'}\\n\\nSincerely,\\nHuman Resources\\nCCLE Rubber`;let blob=new Blob([content],{type:'text/plain'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='CCLE-Employment-Letter-'+id+'.txt';a.click();URL.revokeObjectURL(url)});
function render(){let app=$('#app');if(currentPage==='home')app.innerHTML=home();else if(currentPage==='vacancies'){app.innerHTML=vacancies();['jobSearch','deptFilter','typeFilter'].forEach(id=>$('#'+id).addEventListener('input',drawVacancies));drawVacancies()}else if(currentPage==='benefits'){app.innerHTML=benefits();$('#newBenefits').onclick=()=>drawBenefits('new');$('#oldBenefits').onclick=()=>drawBenefits('old');drawBenefits('new')}else if(currentPage==='login'){app.innerHTML=login();loginBind()}else if(currentPage==='dashboard'){app.innerHTML=dashboard();if(currentUser)dashBind()}}
async function init(){let {data:{session}}=await db.auth.getSession();currentUser=session?.user||null;if(currentUser)await loadProfile();setNav();await loadJobs();render();db.auth.onAuthStateChange(async(_event,session)=>{currentUser=session?.user||null;if(currentUser)await loadProfile();else profile=null;setNav();if(currentPage==='dashboard'||currentPage==='login')render()})}
init().catch(e=>{console.error(e);notify(e.message,'error')});
})();
</script>
</body></html>
